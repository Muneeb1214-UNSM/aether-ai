<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>AETHER AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header + sliding tab bar on top, content grid below, floating voice orb bottom-right.
   Aurora theme: deep night sky in dark mode, clear morning sky in light mode. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#f1f4fa; --line:#e1e7f1; --ink:#0f172a; --muted:#5a6683;
  --a1:#0d9488; --a2:#4f46e5; --a3:#db2777; --warm:#d97706; --on-accent:#ffffff;
  --c-study:#2563eb; --c-health:#059669; --c-work:#d97706; --c-personal:#9333ea; --c-social:#db2777;
  --ok:#059669; --bad:#dc2626;
  --glow:rgba(79,70,229,.10); --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
  --blob-op:.22;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070b18; --surface:#0f1528; --surface-2:#151d36; --line:#212b4a; --ink:#eef2ff; --muted:#93a0c4;
  --a1:#2dd4bf; --a2:#818cf8; --a3:#f472b6; --warm:#fbbf24; --on-accent:#070b18;
  --c-study:#60a5fa; --c-health:#34d399; --c-work:#fbbf24; --c-personal:#c084fc; --c-social:#f472b6;
  --ok:#34d399; --bad:#f87171;
  --glow:rgba(129,140,248,.18); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --blob-op:.35; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070b18; --surface:#0f1528; --surface-2:#151d36; --line:#212b4a; --ink:#eef2ff; --muted:#93a0c4;
  --a1:#2dd4bf; --a2:#818cf8; --a3:#f472b6; --warm:#fbbf24; --on-accent:#070b18;
  --c-study:#60a5fa; --c-health:#34d399; --c-work:#fbbf24; --c-personal:#c084fc; --c-social:#f472b6;
  --ok:#34d399; --bad:#f87171;
  --glow:rgba(129,140,248,.18); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --blob-op:.35; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px;border-radius:8px}
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--blob-op)}
.aurora i:nth-child(1){width:520px;height:520px;background:var(--a1);top:-180px;left:-120px}
.aurora i:nth-child(2){width:460px;height:460px;background:var(--a2);top:-120px;right:-140px}
.aurora i:nth-child(3){width:380px;height:380px;background:var(--a3);bottom:-200px;left:35%;opacity:calc(var(--blob-op)*.6)}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-left:32px;padding-right:32px}}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 200deg,var(--a1),var(--a2),var(--a3),var(--a1));display:grid;place-items:center;box-shadow:0 6px 20px var(--glow)}
.logo-mark::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--bg)}
.logo b{font-family:var(--f-display);font-size:20px;letter-spacing:.06em}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.warn .dot{background:var(--warm)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .15s,border-color .15s}
.icon-btn:hover{border-color:var(--a2);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px}

/* tabs */
.tabs-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;padding-block:8px}
.tabs-wrap .tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.tabs{position:relative;display:flex;gap:4px;padding:5px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;box-shadow:var(--shadow)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:10px 16px;border:0;background:none;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .25s}
.tab svg{width:17px;height:17px;flex:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--on-accent)}
.tab-ink{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;border-radius:10px;background:linear-gradient(120deg,var(--a1),var(--a2));box-shadow:0 6px 18px var(--glow);transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}

/* page */
main{padding-block:18px 120px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.page-head h1{font-size:clamp(24px,3.4vw,32px);margin-top:4px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.span2{grid-column:1/-1}
@media (min-width:1000px){.home-main{grid-template-columns:1.4fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow);transition:border-color .2s,transform .2s}
.card:hover{border-color:color-mix(in srgb,var(--a2) 35%,var(--line))}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.card-h h2{font-size:17px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.anim .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{transform:translateY(16px)}}

/* hero */
.hero{position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(125deg,#0f766e,#1d4ed8 55%,#7c3aed);padding:26px}
.hero::after{content:"";position:absolute;width:340px;height:340px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.hero-in{position:relative;z-index:1;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero h1{font-size:clamp(24px,3.6vw,34px)}
.hero p{margin:8px 0 0;opacity:.9;max-width:52ch}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-hero{border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:#fff;color:#1e1b4b;display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.btn-hero.alt{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-hero:hover{transform:translateY(-2px)}
.btn-hero svg{width:17px;height:17px}

/* rings */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .bg{fill:none;stroke:var(--surface-2)}
.ring .fg{fill:none;stroke-linecap:round;stroke-dashoffset:var(--off);transition:stroke-dashoffset .6s ease}
.anim .ring .fg{animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringin{from{stroke-dashoffset:var(--full)}}
.ring .lbl{position:absolute;text-align:center;line-height:1.1}
.ring .lbl b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.ring .lbl small{display:block;font-size:11px;opacity:.8}
.hero .ring .bg{stroke:rgba(255,255,255,.2)}
.hero .ring .fg{stroke:#fff}

/* kpis */
.kpi{display:flex;align-items:center;gap:14px}
.kpi .k-lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi .k-val{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k-val small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .k-note{font-size:12px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0;border-radius:10px;transition:background .15s}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted)}
.time{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:48px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,currentColor 12%,transparent)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;transition:all .2s}
.check:hover{border-color:var(--ok)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);animation:pop .3s}
.check[aria-pressed="true"]::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes pop{50%{transform:scale(1.2)}}
.del{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;opacity:.6;flex:none}
.del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);opacity:1}
.del svg{width:16px;height:16px}
.now-line{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--a3);padding:4px 0;text-transform:uppercase;letter-spacing:.08em}
.now-line::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--a3),transparent);border-radius:2px}

/* forms */
form.add{display:flex;flex-wrap:wrap;gap:10px}
.inp,select.inp,textarea.inp{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--a2);box-shadow:0 0 0 4px var(--glow)}
.inp.wide{flex:1 1 220px}
textarea.inp{width:100%;resize:vertical;min-height:70px}
.btn{border:0;background:linear-gradient(120deg,var(--a1),var(--a2));color:var(--on-accent);border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px var(--glow)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.big-num{font-family:var(--f-mono);font-size:34px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--a2)}
.switch{position:relative;width:48px;height:28px;border-radius:999px;border:0;background:var(--line);cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch[aria-pressed="true"]{background:var(--ok)}
.switch[aria-pressed="true"]::after{transform:translateX(20px)}

/* health */
.glasses{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.glass{width:30px;height:40px;border:2px solid var(--c-health);border-radius:4px 4px 10px 10px;position:relative;overflow:hidden;cursor:pointer;background:none;padding:0}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c-health) 60%,transparent),var(--c-health));transition:height .45s cubic-bezier(.3,1.2,.5,1)}
.glass.full::after{height:72%}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;transition:transform .15s}
.mood:hover{transform:translateY(-2px)}
.mood i{width:10px;height:10px;border-radius:50%}
.mood[aria-pressed="true"]{border-color:var(--a2);box-shadow:0 0 0 3px var(--glow);color:var(--ink)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .6s ease}
.anim .bar i{animation:barin 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes barin{from{width:0}}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b{transform-box:fill-box;transform-origin:bottom}
.anim .chart .b{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.spark{width:120px;height:40px;flex:none}

/* social */
.acct{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.acct:first-child{border-top:0}
.plat-badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--f-display);font-size:15px;flex:none}
.status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:0;cursor:pointer;white-space:nowrap}
.status.draft{background:var(--surface-2);color:var(--muted)}
.status.scheduled{background:color-mix(in srgb,var(--warm) 18%,transparent);color:var(--warm)}
.status.posted{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

/* habits grid */
.hgrid{overflow-x:auto}
.hgrid table{border-collapse:separate;border-spacing:6px;min-width:520px;width:100%}
.hgrid th{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.hgrid th:first-child{text-align:left}
.hgrid td{text-align:center}
.hgrid td:first-child{text-align:left;font-weight:600}
.flame{font-family:var(--f-mono);font-weight:600;color:var(--warm)}

/* misc */
.callout{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px dashed color-mix(in srgb,var(--a2) 50%,var(--line));background:color-mix(in srgb,var(--a2) 7%,var(--surface));border-radius:var(--r);padding:16px 18px}
.callout p{margin:0;max-width:60ch}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;max-width:70ch}
.timer{font-family:var(--f-mono);font-size:40px;font-weight:600;font-variant-numeric:tabular-nums}

/* voice assistant */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a3),var(--a1));box-shadow:0 10px 30px var(--glow),0 0 0 6px color-mix(in srgb,var(--a2) 15%,transparent);display:grid;place-items:center;color:#fff}
.fab svg{width:26px;height:26px;position:relative;z-index:1}
.fab::before{content:"";position:absolute;inset:5px;border-radius:50%;background:color-mix(in srgb,#0b1020 55%,transparent)}
@media (prefers-reduced-motion:no-preference){.fab{animation:glow 2.4s ease-in-out infinite}}
@keyframes glow{50%{box-shadow:0 10px 36px var(--glow),0 0 0 12px color-mix(in srgb,var(--a2) 10%,transparent)}}
.fab-label{position:fixed;right:calc(94px + env(safe-area-inset-right,0px));bottom:calc(38px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:var(--shadow);pointer-events:none}
@media (max-width:600px){.fab-label{display:none}}
.va{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 32px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform-origin:bottom right}
.va[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.va{animation:vain .35s cubic-bezier(.2,1.2,.4,1)}}
@keyframes vain{from{opacity:0;transform:scale(.85) translateY(20px)}}
.va-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.va-head b{font-family:var(--f-display)}
.va-stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 16px 12px;text-align:center}
.orb{width:110px;height:110px;border-radius:50%;border:0;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 30%,#fff 0,transparent 30%),conic-gradient(from 90deg,var(--a1),var(--a2),var(--a3),var(--a1));box-shadow:0 12px 40px var(--glow);display:grid;place-items:center;color:#fff;transition:transform .2s}
.orb:hover{transform:scale(1.04)}
.orb svg{width:34px;height:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.orb.listening{animation:breathe 1.2s ease-in-out infinite}
.orb.listening::before,.orb.listening::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--a2);animation:ripple 1.6s ease-out infinite}
.orb.listening::after{animation-delay:.8s}
@keyframes breathe{50%{transform:scale(1.07)}}

<script>
/* ---------- icons ---------- */
const P={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  heart:'<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>',
  mute:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  play:'<path d="M7 4l13 8-13 8z"/>', pause:'<path d="M7 4h4v16H7zM14 4h4v16h-4z"/>'
};
const ic=(n,extra="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${P[n]}</svg>`;

/* ---------- constants & state ---------- */
const SECTIONS=[
  {id:"home",label:"Home",icon:"home",sub:"Your day at a glance."},
  {id:"schedule",label:"Schedule",icon:"cal",sub:"Plan your tasks. Aether reminds you on time."},
  {id:"health",label:"Health",icon:"heart",sub:"Water, sleep, steps and mood."},
  {id:"study",label:"Study",icon:"book",sub:"Track study time and stay focused."},
  {id:"career",label:"Career",icon:"brief",sub:"Big goals, broken into small steps."},
  {id:"habits",label:"Habits",icon:"repeat",sub:"Small daily habits build big results."},
  {id:"social",label:"Social",icon:"share",sub:"Plan posts and watch your followers grow."},
];
const CATS={study:"Study",health:"Health",work:"Work",personal:"Personal",social:"Social"};
const PLATFORMS={Instagram:"#d6297a",Facebook:"#1877f2",LinkedIn:"#0a66c2",X:"#111827",WhatsApp:"#16a34a"};
const MOODS=[["Bad","var(--bad)"],["Low","var(--warm)"],["Okay","var(--muted)"],["Good","var(--c-study)"],["Great","var(--ok)"]];
const STEP_GOAL=8000;

const blank=()=>({tasks:[],health:{},goals:{water:8,sleep:8,steps:8000},study:{subjects:[],sessions:[]},career:[],habits:[],social:{accounts:[],posts:[]},example:false});
let S=blank(), view="home", schedFilter="today", store={kind:"none"}, pendingSave=null, saving=Promise.resolve(), dirty=false, animate=true;

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00");d.setDate(d.getDate()+n);return ymd(d)};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDay=s=>{const t=today();if(s===t)return"Today";if(s===addDays(t,1))return"Tomorrow";if(s===addDays(t,-1))return"Yesterday";return new Date(s+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})};
const fmtTime=hm=>{if(!hm)return"Any time";let[h,m]=hm.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(m)+" "+ap};
const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const last7=()=>Array.from({length:7},(_,i)=>addDays(today(),i-6));
const dayLbl=s=>new Date(s+"T00:00").toLocaleDateString("en-GB",{weekday:"short"}).slice(0,2);
const hd=(date=today())=>S.health[date]||(S.health[date]={water:0,sleep:"",steps:"",workout:false,mood:null});
const H=(date=today())=>S.health[date]||{water:0,sleep:"",steps:"",workout:false,mood:null};
const find=(arr,id)=>arr.find(x=>x.id===id);
const sortT=a=>a.slice().sort((x,y)=>(x.date+(x.time||"99")).localeCompare(y.date+(y.time||"99")));
const todayTasks=()=>sortT(S.tasks.filter(k=>k.date===today()));
const studyMins=d=>S.study.sessions.filter(s=>s.date===d).reduce((a,s)=>a+ +s.mins,0);
const gp=g=>g.milestones.length?g.milestones.filter(m=>m.done).length/g.milestones.length:0;
function streak(x){let n=0,d=today();if(!(x.days&&x.days[d]))d=addDays(d,-1);while(x.days&&x.days[d]){n++;d=addDays(d,-1)}return n}
const isEmpty=()=>!S.tasks.length&&!S.study.subjects.length&&!S.career.length&&!S.habits.length&&!S.social.accounts.length&&!S.social.posts.length&&!Object.keys(S.health).length;

/* ---------- storage ---------- */
function normalize(d){const b=blank();d=d&&typeof d==="object"?d:{};
  return {...b,...d,goals:{...b.goals,...(d.goals||{})},study:{...b.study,...(d.study||{})},social:{...b.social,...(d.social||{})}}}
function save(){
  dirty=true;clearTimeout(pendingSave);
  pendingSave=setTimeout(()=>{
    const body=JSON.parse(JSON.stringify(S));
    saving=saving.then(async()=>{
      try{
        if(store.kind==="db")await store.ref.set(body);
        else localStorage.setItem("aether-state",JSON.stringify(body));
        dirty=false;setSync();
      }catch(e){toast("Could not save",e&&e.code==="quota_exceeded"?"Storage is full. Delete some old items.":"Check your internet. We will try again on your next change.")}
    });
  },500);
}
function setSync(){
  const el=document.getElementById("sync");
  if(store.kind==="db"){el.className="chip";el.innerHTML='<span class="dot"></span>Saved to your account'}
  else{el.className="chip warn";el.innerHTML='<span class="dot"></span>Saved on this device'}
}
async function boot(){
  initTheme();buildTabs();render();
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")])}catch(e){}
  const id=user?await user.id():null;
  if(db&&id){
    const ref=db.doc("data/users/"+id+"/aether");store={kind:"db",ref};
    try{const s=await ref.get();if(s.exists)S=normalize(s.data())}catch(e){}
    ref.onSnapshot(s=>{if(s.metadata.hasPendingWrites||dirty||!s.exists)return;S=normalize(s.data());render()},()=>{});
  }else{
    store={kind:"local"};
    try{const raw=localStorage.getItem("aether-state");if(raw)S=normalize(JSON.parse(raw))}catch(e){}
  }
  try{const v=localStorage.getItem("aether-view");if(v&&SECTIONS.some(s=>s.id===v))view=v}catch(e){}
  if(location.hash&&SECTIONS.some(s=>"#"+s.id===location.hash))view=location.hash.slice(1);
  setSync();go(view);startAlerts();
}

/* ---------- theme ---------- */
function curTheme(){const t=document.documentElement.dataset.theme;if(t)return t;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function initTheme(){try{const t=localStorage.getItem("aether-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}paintTheme()}
function paintTheme(){document.getElementById("themeBtn").innerHTML=ic(curTheme()==="dark"?"sun":"moon")}
document.getElementById("themeBtn").onclick=()=>{const t=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("aether-theme",t)}catch(e){}paintTheme()};
document.querySelector('[data-act="alerts"]').innerHTML=ic("bell");

/* ---------- tabs ---------- */
function buildTabs(){
  const nav=document.getElementById("tabs");
  nav.insertAdjacentHTML("beforeend",SECTIONS.map(s=>`<button class="tab" role="tab" id="tab-${s.id}" data-go="${s.id}" aria-selected="false">${ic(s.icon)}<span>${s.label}</span></button>`).join(""));
  addEventListener("resize",moveInk);
  try{document.fonts.ready.then(moveInk)}catch(e){}
}
function moveInk(){
  const b=document.getElementById("tab-"+view),ink=document.getElementById("ink");if(!b)return;
  ink.style.width=b.offsetWidth+"px";ink.style.transform=`translateX(${b.offsetLeft}px)`;
}
function go(v){
  view=v;animate=true;
  try{localStorage.setItem("aether-view",v)}catch(e){}
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.go===v));
  const b=document.getElementById("tab-"+v);b&&b.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  render();moveInk();
}

/* ---------- small components ---------- */
function ring(p,size,stroke,color,label,small){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,p)));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke="${color}" stroke-dasharray="${c}" style="--off:${off};--full:${c}"/></svg>${label!=null?`<div class="lbl"><b>${label}</b>${small?`<small>${small}</small>`:""}</div>`:""}</div>`;
}
function barChart(values,labels,color,unit,goal){
  const W=340,Hh=150,L=30,B=22,T=12;const max=Math.max(1,goal||0,...values);const top=Math.ceil(max);
  const bw=(W-L-6)/values.length;
  let g=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Last 7 days">`;
  [0,.5,1].forEach(f=>{const y=Hh-B-(Hh-B-T)*f;g+=`<line class="gl" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" ${f?'stroke-dasharray="3 4"':""}/><text x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(top*f)}${f?unit:""}</text>`});
  if(goal){const y=Hh-B-(Hh-B-T)*(goal/top);g+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="${color}" stroke-dasharray="6 4" opacity=".7"/><text x="${W-4}" y="${y-4}" text-anchor="end" style="fill:${color}">goal</text>`}
  values.forEach((v,i)=>{const h=(v/top)*(Hh-B-T);const x=L+i*bw+bw*.22,w=bw*.56;const last=i===values.length-1;
    g+=`<rect class="b" style="animation-delay:${i*60}ms" x="${x}" y="${Hh-B-h}" width="${w}" height="${Math.max(h,0)}" rx="5" fill="${color}" opacity="${last?1:.5}"><title>${v}${unit}</title></rect>`;
    g+=`<text x="${x+w/2}" y="${Hh-6}" text-anchor="middle" ${last?'style="fill:var(--ink);font-weight:600"':""}>${labels[i]}</text>`});
  return g+"</svg>";
}
function spark(hist,color){
  if(!hist||hist.length<2)return`<span class="meta">Update daily to see a chart</span>`;const W=120,Hh=40;const v=hist.map(h=>+h.followers);const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((y,i)=>[(i/(v.length-1))*(W-8)+4,Hh-5-((y-mn)/r)*(Hh-10)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" aria-hidden="true"><path d="${d} L${l[0]} ${Hh} L4 ${Hh}Z" fill="${color}" opacity=".15"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${l[0]}" cy="${l[1]}" r="4" fill="${color}"/></svg>`;
}
const del=(act,id)=>`<button class="del" data-act="${act}" data-id="${id}" aria-label="Delete">${ic("trash")}</button>`;
const catTag=c=>`<span class="tag" style="color:var(--c-${c})">${CATS[c]||c}</span>`;
const catOpts=sel=>Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===sel?"selected":""}>${v}</option>`).join("");
function taskRow(k,showDay){
  return `<div class="row ${k.done?"done":""}"><button class="check" data-act="toggleTask" data-id="${k.id}" aria-pressed="${!!k.done}" aria-label="Mark done"></button>
  <span class="time">${k.time?fmtTime(k.time).replace(" ","&nbsp;"):"—"}</span>
  <div class="grow"><div class="t">${esc(k.title)}</div>${showDay?`<div class="meta">${fmtDay(k.date)}</div>`:""}</div>${catTag(k.cat)}${del("delTask",k.id)}</div>`;
}
const card=(title,sub,body,cls="",delay=0)=>`<section class="card rise ${cls}" style="animation-delay:${delay}ms"><div class="card-h"><h2>${title}</h2>${sub?`<span class="sub">${sub}</span>`:""}</div>${body}</section>`;

/* ---------- views ---------- */
function vHome(){
  const t=today(),tt=todayTasks(),done=tt.filter(k=>k.done).length,h=H(),sm=studyMins(t);
  const habDone=S.habits.filter(x=>x.days&&x.days[t]).length;
  const next=tt.find(k=>!k.done&&(k.time||"99")>=nowHM())||tt.find(k=>!k.done);
  const hr=new Date().getHours();const greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  const parts=[tt.length?done/tt.length:0,(h.water||0)/S.goals.water,Math.min(1,sm/60),S.habits.length?habDone/S.habits.length:0];
  const dayP=Math.round(parts.reduce((a,b)=>a+Math.min(1,b),0)/4*100);
  const nowHMv=nowHM();let nowShown=false;
  const timeline=tt.map(k=>{let s="";if(!nowShown&&(k.time||"99")>nowHMv){s+=`<div class="now-line">Now · ${fmtTime(nowHMv)}</div>`;nowShown=true}return s+taskRow(k)}).join("")+(tt.length&&!nowShown?`<div class="now-line">Now · ${fmtTime(nowHMv)}</div>`:"");
  const posts=sortT(S.social.posts.filter(p=>p.status!=="posted"&&p.date>=t)).slice(0,3);
  const days=last7();const doneByDay=days.map(d=>S.tasks.filter(k=>k.date===d&&k.done).length);
  return `${isEmpty()?`<div class="callout rise" style="margin-bottom:16px"><p><b>New here?</b> Load sample data to see how AETHER works. You can remove it with one click later. Or tap the round button and say <b>"help"</b>.</p><button class="btn" data-act="loadExample">Show sample data</button></div>`:""}
  <section class="card hero rise"><div class="hero-in"><div>
    <div class="eyebrow">${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
    <h1 style="margin-top:6px">${greet}!</h1>
    <p>${tt.length?`You have <b>${tt.length}</b> tasks today and <b>${done}</b> are done.`:"You have no tasks today."} ${next?`Next: <b>${esc(next.title)}</b>${next.time?` at ${fmtTime(next.time)}`:""}.`:tt.length?"Everything is done. Great work!":""}</p>
    <div class="hero-acts"><button class="btn-hero" data-act="openVoice">${ic("mic")}Talk to Aether</button><button class="btn-hero alt" data-go="schedule">${ic("plus")}Add a task</button></div>
  </div>${ring(dayP/100,128,12,"#fff",dayP+"%","of your day")}</div></section>
  <div class="grid g4" style="margin-top:16px">
    ${kpiCard("Tasks",done,"/"+tt.length,tt.length?done/tt.length:0,"var(--c-work)",tt.length-done?`${tt.length-done} left`:"All clear",60)}
    ${kpiCard("Water",h.water||0,"/"+S.goals.water,(h.water||0)/S.goals.water,"var(--c-health)","glasses today",120)}
    ${kpiCard("Study",sm," min",sm/60,"var(--c-study)","goal 60 min",180)}
    ${kpiCard("Habits",habDone,"/"+S.habits.length,S.habits.length?habDone/S.habits.length:0,"var(--c-personal)","done today",240)}
  </div>
  <div class="grid home-main" style="margin-top:16px">
    ${card("Today's plan",`${done}/${tt.length} done`,`<div class="list">${timeline||`<div class="empty"><b>No tasks yet</b>Add one in Schedule, or say "add task gym at 6 pm".</div>`}</div>`,"",280)}

/* ---------- alerts ---------- */
let audioCtx=null;
function beep(){try{audioCtx=audioCtx||new AudioContext();[0,.18].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=i?1046:784;g.gain.setValueAtTime(.12,audioCtx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d+.45);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+.5)})}catch(e){}}
function toast(title,body){
  const box=document.getElementById("toasts"),t=document.createElement("div");t.className="toast";
  t.innerHTML=`<div><b></b><span></span></div><button aria-label="Close">×</button>`;
  t.querySelector("b").textContent=title;t.querySelector("span").textContent=body;
  t.querySelector("button").onclick=()=>t.remove();box.appendChild(t);setTimeout(()=>t.remove(),9000);
}
function notify(title,body){toast(title,body);beep();speak(title);try{if("Notification" in window&&Notification.permission==="granted")new Notification(title,{body})}catch(e){}}
function checkAlerts(){
  const t=today(),hm=nowHM(),d=new Date(Date.now()-30*60000),since=pad(d.getHours())+":"+pad(d.getMinutes());let ch=false;
  const due=x=>x.time&&x.time<=hm&&(x.time>=since||since>hm);
  for(const k of S.tasks){if(k.done||k.notified||k.date!==t||!due(k))continue;notify("Time for: "+k.title,fmtTime(k.time)+" · "+(CATS[k.cat]||""));k.notified=true;ch=true}
  for(const p of S.social.posts){if(p.status!=="scheduled"||p.notified||p.date!==t||!due(p))continue;notify("Time to post on "+p.platform,p.text.slice(0,80));p.notified=true;ch=true}
  if(ch){save();render()}
}
function startAlerts(){checkAlerts();setInterval(checkAlerts,20000)}
async function askNotify(){
  beep();
  try{if(!("Notification" in window))throw 0;const r=await Notification.requestPermission();if(r==="granted"){toast("Alerts are on","You will also get notifications from your browser.");return}throw 0}
  catch(_){toast("Alerts stay on this page","Your browser did not allow notifications here. Keep this page open and Aether will pop up and play a sound.")}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);window.scrollTo({top:0,behavior:"smooth"});return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.dataset.id,n=+b.dataset.n,t=today();
  switch(b.dataset.act){
    case"toggleTask":{const k=find(S.tasks,id);k.done=!k.done;if(k.done)toast("Nice work!",k.title+" is done.");break}
    case"delTask":S.tasks=S.tasks.filter(k=>k.id!==id);break;
    case"filter":schedFilter=id;animate=true;render();return;
    case"water":addWater(n);break;
    case"setWater":{const h=hd();h.water=h.water===n?n-1:n;break}
    case"workout":{const h=hd();h.workout=!h.workout;break}
    case"mood":hd().mood=n;break;
    case"delSubj":S.study.subjects=S.study.subjects.filter(s=>s.id!==id);break;
    case"pomo":togglePomo();return;
    case"pomoReset":clearInterval(pomo.run);pomo={left:25*60,total:25*60,run:null};render();return;
    case"delGoal":S.career=S.career.filter(x=>x.id!==id);break;
    case"toggleMs":{const m=find(S.career,id).milestones[n];m.done=!m.done;break}
    case"toggleHabit":{const x=find(S.habits,id);x.days=x.days||{};const d=b.dataset.d||t;if(x.days[d])delete x.days[d];else x.days[d]=true;break}
    case"delHabit":S.habits=S.habits.filter(x=>x.id!==id);break;
    case"delAcc":S.social.accounts=S.social.accounts.filter(a=>a.id!==id);break;
    case"cyclePost":{const p=find(S.social.posts,id),o=["draft","scheduled","posted"];p.status=o[(o.indexOf(p.status)+1)%3];p.notified=false;break}
    case"delPost":S.social.posts=S.social.posts.filter(p=>p.id!==id);break;
    case"copyPost":{const p=find(S.social.posts,id);navigator.clipboard.writeText(p.text).then(()=>toast("Copied","Now paste it in the app."),()=>toast("Could not copy","Select the text and copy it yourself."));return}
    case"alerts":askNotify();return;
    case"openVoice":openVA();return;
    case"loadExample":S=exampleData();animate=true;toast("Sample data loaded","Look around. Remove it any time.");break;
    case"clearExample":S=blank();animate=true;break;
    default:return;
  }
  save();render();
});
function addWater(n){const h=hd();h.water=Math.max(0,(h.water||0)+n);if(n>0&&h.water===S.goals.water)toast("Goal reached!","You drank "+h.water+" glasses of water today.");}
document.addEventListener("input",e=>{if(e.target.id==="h-sleep"){const v=document.getElementById("sleepVal");if(v)v.firstChild.textContent=e.target.value}});
document.addEventListener("change",e=>{const f=e.target.dataset.health;if(!f)return;hd()[f]=e.target.value;save();if(f==="steps")render()});
document.addEventListener("submit",e=>{
  if(e.target.id==="vaForm")return;
  e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),fid=f.dataset.id;
  switch(f.dataset.form){
    case"task":addTask(d.title.trim(),d.date,d.time,d.cat,+d.rep||1);toast("Task added",d.title+(d.time?" · "+fmtTime(d.time):""));break;
    case"subject":S.study.subjects.push({id:uid(),name:d.name.trim(),weeklyGoal:+d.goal||5});break;
    case"session":if(!d.subj)return;S.study.sessions.push({id:uid(),subj:d.subj,date:today(),mins:+d.mins||0});toast("Saved","Your study time is logged.");break;
    case"goal":S.career.push({id:uid(),title:d.title.trim(),due:d.due,milestones:[]});break;
    case"ms":find(S.career,fid).milestones.push({t:d.t.trim(),done:false});break;
    case"habit":S.habits.push({id:uid(),name:d.name.trim(),days:{}});break;
    case"account":S.social.accounts.push({id:uid(),platform:d.platform,handle:d.handle.trim(),history:d.f!==""?[{date:today(),followers:+d.f}]:[]});break;
    case"followers":{if(d.n==="")return;const a=find(S.social.accounts,fid);a.history=(a.history||[]).filter(h=>h.date!==today());a.history.push({date:today(),followers:+d.n});break}
    case"post":S.social.posts.push({id:uid(),platform:d.platform,date:d.date,time:d.time,text:d.text.trim(),status:"scheduled"});toast("Post planned","Aether will remind you.");break;
    default:return;
  }
  save();render();
});
function addTask(title,date,time,cat,count=1){for(let i=0;i<count;i++)S.tasks.push({id:uid(),title,date:addDays(date,i),time:time||"",cat:cat||"personal",done:false})}

function togglePomo(){
  if(pomo.run){clearInterval(pomo.run);pomo.run=null;render();return}
  pomo.subj=(document.getElementById("p-subj")||{}).value||"";
  pomo.run=setInterval(()=>{
    pomo.left--;
    const tx=document.getElementById("pomoTxt");if(tx)tx.textContent=pad(Math.floor(pomo.left/60))+":"+pad(pomo.left%60);
    const fg=document.querySelector("#pomoRing .fg");if(fg){const c=+fg.getAttribute("stroke-dasharray");fg.style.setProperty("--off",c*(pomo.left/pomo.total))}
    if(pomo.left<=0){clearInterval(pomo.run);pomo.run=null;pomo.left=pomo.total;
      if(pomo.subj){S.study.sessions.push({id:uid(),subj:pomo.subj,date:today(),mins:25});save()}
      notify("Focus session done","25 minutes done. Take a 5 minute break.");if(view==="study")render()}
  },1000);render();
}

/* ---------- voice assistant ---------- */
const va=document.getElementById("va"),orb=document.getElementById("orb"),vaState=document.getElementById("vaState"),vaLog=document.getElementById("vaLog");
let muted=false,rec=null,listening=false;
try{muted=localStorage.getItem("aether-mute")==="1"}catch(e){}
document.getElementById("fab").innerHTML=ic("mic");orb.innerHTML=ic("mic");document.getElementById("vaClose").innerHTML=ic("x");
const paintMute=()=>document.getElementById("muteBtn").innerHTML=ic(muted?"mute":"vol");paintMute();
document.getElementById("muteBtn").onclick=()=>{muted=!muted;try{localStorage.setItem("aether-mute",muted?"1":"0")}catch(e){}paintMute();if(muted)try{speechSynthesis.cancel()}catch(e){}};
const SUGS=["What is my plan today?","Add task gym at 6 pm","I drank water","I slept 7 hours","Start focus timer","How am I doing?","Help"];
document.getElementById("sugs").innerHTML=SUGS.map(s=>`<button class="sug" type="button">${s}</button>`).join("");
document.getElementById("sugs").onclick=e=>{const s=e.target.closest(".sug");if(s)handle(s.textContent)};
document.getElementById("fab").onclick=openVA;
document.getElementById("vaClose").onclick=()=>{va.hidden=true;stopListen();document.getElementById("fab").hidden=false;document.getElementById("fabLabel").hidden=false};
let greeted=false;
function openVA(){va.hidden=false;document.getElementById("fab").hidden=true;document.getElementById("fabLabel").hidden=true;
  if(!greeted){greeted=true;const hr=new Date().getHours();addMsg("ai",(hr<12?"Good morning":hr<17?"Good afternoon":"Good evening")+"! I am Aether. Tap the circle and talk to me, or type below. Say \"help\" to see what I can do.")}
  document.getElementById("vaText").focus({preventScroll:true})}
function addMsg(who,text){const m=document.createElement("div");m.className="msg "+who;m.textContent=text;vaLog.appendChild(m);vaLog.scrollTop=vaLog.scrollHeight}
function speak(text){if(muted)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=1;const v=speechSynthesis.getVoices().find(v=>/en(-|_)(US|GB)/.test(v.lang)&&/female|samantha|zira|aria|jenny|google us/i.test(v.name));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
document.getElementById("vaForm").onsubmit=e=>{e.preventDefault();const i=document.getElementById("vaText");if(i.value.trim())handle(i.value.trim());i.value=""};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
orb.onclick=()=>listening?stopListen():startListen();
function setListen(on,msg){listening=on;orb.classList.toggle("listening",on);document.getElementById("vaStage").classList.toggle("listening-on",on);vaState.textContent=msg}
function startListen(){
  if(!SR){setListen(false,"Voice is not supported here");addMsg("ai","Your browser cannot listen here. Open AETHER in Chrome or Edge to talk, or type your message below.");return}
  try{speechSynthesis.cancel()}catch(e){}
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.maxAlternatives=1;let final="";
  rec.onresult=e=>{let txt="";for(const r of e.results){txt+=r[0].transcript;if(r.isFinal)final=txt}vaState.textContent="“"+txt+"”"};
  rec.onerror=e=>{setListen(false,"Tap the circle and speak");if(e.error==="not-allowed"||e.error==="service-not-allowed")addMsg("ai","I can't use the microphone here. Allow the microphone in your browser, or type your message below.");else if(e.error==="no-speech")addMsg("ai","I didn't hear anything. Tap the circle and try again.")};
  rec.onend=()=>{setListen(false,"Tap the circle and speak");if(final.trim())handle(final.trim())};
  try{rec.start();setListen(true,"Listening…")}catch(e){setListen(false,"Tap the circle and speak")}
}
function stopListen(){try{rec&&rec.stop()}catch(e){}setListen(false,"Tap the circle and speak")}

function parseTime(s){
  let m=s.match(/\b(?:at\s+)?(\d{1,2})(?::|\.)?(\d{2})?\s*(a\.?\s?m\.?|p\.?\s?m\.?)/i)||s.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\b/i);
  if(!m)return"";let h=+m[1],min=+(m[2]||0);const ap=(m[3]||"").toLowerCase().replace(/[.\s]/g,"");
  if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;if(!ap&&h<7)h+=12;
  if(h>23||min>59)return"";return pad(h)+":"+pad(min);
}
function guessCat(s){s=s.toLowerCase();
  if(/stud|read|class|exam|homework|lecture|revise|learn|course/.test(s))return"study";
  if(/gym|walk|run|doctor|exercise|workout|yoga|medicine|swim/.test(s))return"health";
  if(/meet|email|client|work|office|job|project|interview|call with/.test(s))return"work";
  if(/post|instagram|linkedin|facebook|tweet|reel|video|youtube/.test(s))return"social";
  return"personal"}
function summary(){
  const tt=todayTasks(),done=tt.filter(k=>k.done).length,h=H(),sm=studyMins(today()),hb=S.habits.filter(x=>x.days&&x.days[today()]).length;
  return `Today you finished ${done} of ${tt.length} tasks. You drank ${h.water||0} of ${S.goals.water} glasses of water, studied ${sm} minutes, and did ${hb} of ${S.habits.length} habits.`+(done===tt.length&&tt.length?" Amazing work!":"");
}
function handle(raw){
  addMsg("me",raw);const s=raw.toLowerCase().replace(/[?!]/g,"").trim();let r="";
  const tab=SECTIONS.find(x=>new RegExp("\\b(open|show|go to)\\b.*\\b"+x.label.toLowerCase()).test(s)||(x.id==="social"&&/\b(open|show)\b.*\bsocial/.test(s)));
  let m;
  if(/^(help|what can you do)/.test(s)){r="You can say: add task gym at 6 pm. What is my plan today? What is next? I drank water. I slept 7 hours. I walked 5000 steps. Start focus timer. Mark gym done. Open health. How am I doing?"}
  else if(m=s.match(/^(?:add|create|new|remind me to|remind me)\s+(?:a\s+)?(?:task\s+|reminder\s+)?(?:to\s+)?(.+)/)){
    let body=m[1];const time=parseTime(body);const tomorrow=/\btomorrow\b/.test(body);
    let title=body.replace(/\b(?:at\s+)?\d{1,2}(?:[:.]\d{2})?\s*(?:a\.?\s?m\.?|p\.?\s?m\.?)/gi,"").replace(/\bat\s+\d{1,2}(?:[:.]\d{2})?\b/gi,"").replace(/\b(tomorrow|today|at)\b/gi,"").replace(/\s+/g," ").trim();
    if(!title){r="What should the task be? Try: add task call mom at 8 pm."}
    else{title=title[0].toUpperCase()+title.slice(1);const date=tomorrow?addDays(today(),1):today();addTask(title,date,time,guessCat(title));save();render();
      r=`Done. I added "${title}" ${tomorrow?"for tomorrow":"for today"}${time?" at "+fmtTime(time):""}. I will remind you.`}}
  else if(/(plan|schedule|tasks).*(today)|what.*(today)|my day/.test(s)){
    const tt=todayTasks().filter(k=>!k.done);r=tt.length?`You have ${tt.length} tasks left today: `+tt.slice(0,5).map(k=>k.title+(k.time?" at "+fmtTime(k.time):"")).join(", ")+".":"You have no tasks left today. Enjoy your day!"}
  else if(/what.*next|next task/.test(s)){const n=todayTasks().find(k=>!k.done&&(k.time||"99")>=nowHM())||todayTasks().find(k=>!k.done);r=n?`Next is ${n.title}${n.time?" at "+fmtTime(n.time):""}.`:"Nothing is next. You are all done for today."}
  else if(/water|glass/.test(s)&&!/how much/.test(s)){const n=+(s.match(/(\d+)\s*glass/)||[])[1]||1;addWater(n);save();render();const h=H();r=`Great. That is ${h.water} of ${S.goals.water} glasses today.`+(h.water>=S.goals.water?" You reached your goal!":"")}
  else if(m=s.match(/slept\s+(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*hours?\s*(?:of\s*)?sleep/)){const v=m[1]||m[2];hd().sleep=v;save();render();r=`Saved ${v} hours of sleep.`+(+v<S.goals.sleep?" Try to sleep a little more tonight.":" Well rested!")}
  else if(m=s.match(/(\d[\d,]*)\s*steps|walked\s+(\d[\d,]*)/)){const v=(m[1]||m[2]).replace(/,/g,"");hd().steps=v;save();render();r=`Saved ${(+v).toLocaleString()} steps.`+(+v>=STEP_GOAL?" You hit your goal!":` ${(STEP_GOAL-v).toLocaleString()} more to reach your goal.`)}
  else if(/(start|begin).*(focus|timer|pomodoro|study)/.test(s)){go("study");if(!pomo.run)togglePomo();r="Focus timer started for 25 minutes. Good luck!"}
  else if(/(stop|pause).*(timer|focus)/.test(s)){if(pomo.run)togglePomo();r="Timer paused."}
  else if(m=s.match(/(?:mark|finish|complete|done with|i did|i finished)\s+(.+?)(?:\s+as)?(?:\s+done)?$/)){
    const q=m[1].replace(/\b(the|task)\b/g,"").trim();const k=todayTasks().find(k=>!k.done&&k.title.toLowerCase().includes(q))||S.tasks.find(k=>!k.done&&k.title.toLowerCase().includes(q));
    const hb=!k&&S.habits.find(x=>x.name.toLowerCase().includes(q));
    if(k){k.done=true;save();render();r=`Nice! I marked "${k.title}" as done.`}else if(hb){hb.days=hb.days||{};hb.days[today()]=true;save();render();r=`Great! "${hb.name}" is done for today.`}else r=`I couldn't find a task called "${q}".`}
  else if(/how am i doing|summary|report|progress/.test(s)){r=summary()}
  else if(m=s.match(/i feel\s+(\w+)|feeling\s+(\w+)|mood\s+(?:is\s+)?(\w+)/)){const w=(m[1]||m[2]||m[3]);const map={bad:0,sad:0,terrible:0,low:1,tired:1,okay:2,ok:2,fine:2,good:3,happy:3,great:4,amazing:4,awesome:4};
    if(w in map){hd().mood=map[w];save();render();r=`Got it, I saved your mood as ${MOODS[map[w]][0].toLowerCase()}.`+(map[w]<2?" Take a short break and drink some water.":"")}else r="Tell me: I feel bad, low, okay, good or great."}
  else if(tab){go(tab.id);r=`Opening ${tab.label}.`}
  else if(/time is it|what time/.test(s)){r="It is "+fmtTime(nowHM())+"."}
  else if(/^(hi|hello|hey|salam|assalam)/.test(s)){r="Hello! How can I help you today?"}
  else if(/thank/.test(s)){r="You're welcome!"}
  else{r="Sorry, I didn't get that. Say \"help\" to hear what I can do."}
  addMsg("ai",r);speak(r);
}
