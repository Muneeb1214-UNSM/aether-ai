# Netlify settings for AETHER AI.
# index.html is already built and committed; the build step only copies the app files into dist/
# so server code and node_modules are never published as web pages.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r index.html manifest.webmanifest sw.js icons dist/"

# Background alerts server: /api/* and a scheduler that runs every minute (netlify/functions).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Always check for a fresh app page, service worker and manifest so updates arrive quickly.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Icons rarely change, so browsers can keep them for a week.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Basic safety headers. Microphone stays allowed for the voice assistant.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
