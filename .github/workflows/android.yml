# Builds the AETHER Android app (two editions) and publishes them as a GitHub release.
# Download links that always point to the newest APKs:
#   https://github.com/Muneeb1214-UNSM/aether-ai/releases/latest/download/AETHER-AI.apk
#   https://github.com/Muneeb1214-UNSM/aether-ai/releases/latest/download/AETHER-AI-WhatsApp.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Only the main repo publishes releases (not the Netlify copy).
    if: github.repository == 'Muneeb1214-UNSM/aether-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle -p android assembleStandardRelease assembleWhatsappRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk AETHER-AI.apk
          cp android/app/build/outputs/apk/whatsapp/release/app-whatsapp-release.apk AETHER-AI-WhatsApp.apk

      - name: Check signatures and contents
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in AETHER-AI.apk AETHER-AI-WhatsApp.apk; do
            echo "== $f"
            "$BT/apksigner" verify --verbose --print-certs "$f" | grep -E "Verifies|v1 scheme|v2 scheme|v3 scheme|SHA-256"
            "$BT/aapt2" dump badging "$f" | grep -E "^package|sdkVersion|targetSdkVersion"
          done
          echo "== Accessibility helper only in the WhatsApp edition:"
          "$BT/aapt2" dump xmltree AETHER-AI.apk --file AndroidManifest.xml | grep -c BIND_ACCESSIBILITY_SERVICE || true
          "$BT/aapt2" dump xmltree AETHER-AI-WhatsApp.apk --file AndroidManifest.xml | grep -c BIND_ACCESSIBILITY_SERVICE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: AETHER AI for Android 1.0.${{ github.run_number }}
          make_latest: "true"
          files: |
            AETHER-AI.apk
            AETHER-AI-WhatsApp.apk
          body: |
            **Which one?**
            - **AETHER-AI.apk** (recommended): alarms that speak, voice assistant, mentors, Done / Delete task buttons. Installs normally.
            - **AETHER-AI-WhatsApp.apk**: everything above, plus scheduled WhatsApp messages that send by themselves. It uses Android Accessibility, so Google Play Protect may block it.

            **Install:** download on your Android phone, open the file, and allow installing from your browser if Android asks. If Play Protect warns about an unknown developer, tap **More details → Install anyway**.
